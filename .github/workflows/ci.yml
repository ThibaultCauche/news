name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Secrets factices : suffisent pour migrer le schéma et faire tourner les
    # tests (contre le vrai Postgres/Redis du job) ; aucun appel réseau réel
    # aux fournisseurs n'est fait dans les tests.
    env:
      DATABASE_URL: postgresql://news:news@localhost:5432/news
      REDIS_URL: redis://localhost:6379
      PANDASCORE_TOKEN: ci
      LIQUIPEDIA_USER_AGENT: "News/CI (contact: ci@example.com)"
      JWT_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: news
          POSTGRES_PASSWORD: news
          POSTGRES_DB: news
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U news"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @news/db exec prisma migrate deploy

      - run: pnpm --filter @news/db exec prisma generate

      - run: pnpm -r lint

      # --workspace-concurrency=1 : les tests d'intégration de apps/api et
      # apps/worker partagent le même Postgres de CI, les lancer en parallèle
      # a produit des faux échecs (contention) en vérifiant ce jalon en local.
      - run: pnpm -r --workspace-concurrency=1 test

      # apps/mobile dépend de packages/api_client_dart (gitignored, généré
      # depuis l'OpenAPI, cf. CLAUDE.md) : on écrit la spec ici, où Postgres/
      # Redis/les secrets factices sont déjà en place pour démarrer l'API.
      - run: pnpm --filter @news/api generate:openapi

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

  mobile:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: openapi-spec

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Client Dart généré depuis openapi.json (règle 11 de CLAUDE.md : jamais
      # écrit à la main), même pipeline que `pnpm generate:dart-client` en local.
      # analyzer 14.5.0 (publié début octobre 2026) casse build_runner 2.16.1 (« contextFeatures isn't
      # defined ») : on reste sur 14.4.0, la version qui marche en local. À retirer quand build_runner suit.
      - run: |
          mkdir -p packages/api_client_dart
          echo "dependency_overrides:" > packages/api_client_dart/pubspec_overrides.yaml
          echo "  analyzer: 14.4.0" >> packages/api_client_dart/pubspec_overrides.yaml
      - run: pnpm generate:dart-client

      - run: flutter pub get
        working-directory: apps/mobile

      - run: flutter analyze
        working-directory: apps/mobile

      - run: flutter test
        working-directory: apps/mobile
